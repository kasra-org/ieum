services:
  db:
    image: postgres:13
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Dependents wait on this rather than on the port being open: postgres
    # accepts connections briefly during init before it will serve queries.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: always

  caddy:
    image: caddy:2.8.4
    ports:
      - "9080:80"
    environment:
      - DJANGO_ADMIN_PAGE_NAME=${DJANGO_ADMIN_PAGE_NAME}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      - static_data:/www/static
      - media_data:/www/media
    restart: always

  # Migrations run here rather than in the backend's own entrypoint, so that a
  # plain `docker compose up -d` applies them even when nothing about the
  # backend service changed and its container is left running as-is. Everything
  # that touches the database waits for this to finish successfully, so no
  # process ever serves or consumes against a schema older than the code.
  migrate:
    build: ./backend
    command: >
      sh -c "python manage.py migrate --noinput &&
             (python manage.py ensure_superuser || echo 'ensure_superuser failed; continuing.')"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_HOST=db
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD}
      - DJANGO_SUPERUSER_FIRST_NAME=${DJANGO_SUPERUSER_FIRST_NAME}
      - DJANGO_SUPERUSER_LAST_NAME=${DJANGO_SUPERUSER_LAST_NAME}
      - DJANGO_SUPERUSER_INSTITUTE=${DJANGO_SUPERUSER_INSTITUTE}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    # One shot: it exits when the schema is current, and must not be revived.
    restart: "no"

  backend:
    build: ./backend
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DJANGO_ADMIN_PAGE_NAME=${DJANGO_ADMIN_PAGE_NAME}
      - ALLOWED_HOST=127.0.0.1
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_HOST=db
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - EMAIL_PREFIX=${EMAIL_PREFIX}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - EMAIL_PORT=${EMAIL_PORT}
      - HEADLESS_URL_ROOT=http://127.0.0.1:9080
      - ORCID_BASE_DOMAIN=sandbox.orcid.org
      - ACCOUNT_DEFAULT_HTTP_PROTOCOL=http
      - LOG_FILE=/dev/null
      - DEBUG=True
      - DJANGO_SUPERUSER_EMAIL=${DJANGO_SUPERUSER_EMAIL}
      - DJANGO_SUPERUSER_PASSWORD=${DJANGO_SUPERUSER_PASSWORD}
      - DJANGO_SUPERUSER_FIRST_NAME=${DJANGO_SUPERUSER_FIRST_NAME}
      - DJANGO_SUPERUSER_LAST_NAME=${DJANGO_SUPERUSER_LAST_NAME}
      - DJANGO_SUPERUSER_INSTITUTE=${DJANGO_SUPERUSER_INSTITUTE}
      - TOSS_SECRET_KEY=${TOSS_SECRET_KEY}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - PAYPAL_SECRET_KEY=${PAYPAL_SECRET_KEY}
      - PAYPAL_API_URL=https://api-m.sandbox.paypal.com
      - NICEPAY_MID=${NICEPAY_MID}
      - NICEPAY_MERCHANT_KEY=${NICEPAY_MERCHANT_KEY}
      - NICEPAY_RETURN_URL=${NICEPAY_RETURN_URL:-http://127.0.0.1:9080/nicepay/callback}
      - NICEPAY_SITE_URL=${NICEPAY_SITE_URL:-http://127.0.0.1:9080}
      - OPENEXCHANGERATES_APP_ID=${OPENEXCHANGERATES_APP_ID}
    ports:
      - "8090:8080"
    volumes:
      - ./backend:/app
      - static_data:/app/static
      - media_data:/app/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
        - TOSS_CLIENT_KEY=${TOSS_CLIENT_KEY}
        - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
    environment:
      - ALLOWED_HOST=${HOST}
      - ADMIN_PAGE_NAME=${ADMIN_PAGE_NAME}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - TOSS_CLIENT_KEY=${TOSS_CLIENT_KEY}
      - PAYPAL_CLIENT_ID=${PAYPAL_CLIENT_ID}
      - DEBUG=True
      - BODY_SIZE_LIMIT=2097152
    volumes:
      - ./frontend:/app
    restart: always

  rabbitmq:
    image: rabbitmq:3
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "4"

  celery:
    build: ./backend
    command: sh -c "celery -A backend worker -l info"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_HOST=db
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_PREFIX=${EMAIL_PREFIX}
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "4"

  celery-beat:
    build: ./backend
    command: sh -c "celery -A backend beat -l info"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_HOST=db
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_PREFIX=${EMAIL_PREFIX}
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "4"

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  static_data:
  media_data: