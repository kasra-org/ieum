<!doctype html>
<html lang="%paraglide.lang%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<!-- The event pages render their description in the browser, so a plain
		     fetch sees an empty shell. These are the readable equivalent. -->
		<link rel="alternate" type="text/plain" href="/llms.txt" title="Events for agents (index)" />
		<link rel="alternate" type="text/plain" href="/llms-full.txt" title="Events for agents (full)" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta name="theme-color" content="#2563EB" />
		<meta name="robots" content="index, follow" />

		%sveltekit.head%
		<script>
			// Set HTML lang attribute from localStorage before page renders
			const savedLocale = localStorage.getItem('preferred-locale');
			if (savedLocale) {
				document.documentElement.lang = savedLocale;
			}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<noscript>
			<p>
				This site builds its pages in the browser, so this document carries no
				content on its own. For the events as plain text, fetch /llms.txt for the
				list, or /event/&lt;id&gt;/llms.txt for a single event - dates, venue,
				registration fees, deadlines, description, and URLs for any images.
			</p>
		</noscript>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
