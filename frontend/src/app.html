<!doctype html>
<html lang="%paraglide.lang%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<!-- The event pages render their description in the browser, so a plain
		     fetch sees an empty shell. These are the readable equivalent. -->
		<link rel="alternate" type="text/plain" href="/llms.txt" title="Events for agents (index)" />
		<link rel="alternate" type="text/plain" href="/llms-full.txt" title="Events for agents (full)" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<meta name="theme-color" content="#2563EB" />
		<meta name="robots" content="index, follow" />

		%sveltekit.head%
		<script>
			// Set HTML lang attribute from localStorage before page renders
			const savedLocale = localStorage.getItem('preferred-locale');
			if (savedLocale) {
				document.documentElement.lang = savedLocale;
			}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
